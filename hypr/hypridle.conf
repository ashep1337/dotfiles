general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = hyprlock     
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 🌘 Dim screen (backlight only)
listener {
    timeout = 900  # 2.5 minutes
    on-timeout = ddcutil setvcp 10 0
    on-resume = ddcutil setvcp 10 100
}

# 🎹 Keyboard backlight #off
#listener {
#    timeout = 300  # 5 minutes
#    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
#    on-resume = brightnessctl -rd rgb:kbd_backlight
#}

# 🔒 Lock the screen after 5 minutes
listener {
    timeout = 1800  # 5 minutes
    on-timeout = hyprlock
}

# 📴 Turn off display after 20 minutes
listener {
    timeout = 1800  # 20 minutes
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# 🚪 Logout (end session) after 1 hour
listener {
    timeout = 86400  # 1 hour
    on-timeout = systemctl --user exit
}

