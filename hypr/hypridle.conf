general {
    lock_cmd = qs ipc call lock lock || qs ipc call lock lock
    before_sleep_cmd = qs ipc call lock lock     
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 🌘 Dim screen (backlight only)
listener {
    timeout = 900  # 2.5 minutes
    on-timeout = ddcutil setvcp 10 0
    on-resume = ddcutil setvcp 10 100
}

# 🎹 Keyboard backlight #off
#listener {
#    timeout = 300  # 5 minutes
#    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
#    on-resume = brightnessctl -rd rgb:kbd_backlight
#}

# 🔒 Lock the screen after 10 minutes
listener {
    timeout = 1200 # 10 minutes
    on-timeout = qs ipc call lock lock
}

# 📴 Turn off display after 10 minutes
listener {
    timeout = 1200
    ignore_inhibit = true
    on-timeout = /home/ashep/bin/lights_off; /home/ashep/bin/close-frigate-firefox.sh
    on-resume =  /home/ashep/bin/lights_on; /home/ashep/bin/open-frigate-firefox.sh
}

